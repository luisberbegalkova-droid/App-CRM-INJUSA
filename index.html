<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INJUSA CRM - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .nav-active { background: #000; color: #fff; }
        .card { background: white; border-radius: 1.5rem; border: 1px solid #e5e7eb; padding: 1.5rem; }
        .chart-box { height: 32vh; position: relative; }
    </style>
</head>
<body class="bg-[#f8fafc] h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r flex flex-col p-6 gap-6 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-black text-white rounded-xl flex items-center justify-center font-black">I</div>
            <h1 class="font-black text-xl tracking-tight">CRM INJUSA</h1>
        </div>
        <nav class="space-y-2">
            <button onclick="switchTab('dash')" id="tab-dash" class="nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all"><span class="material-symbols-outlined">dashboard</span> Dashboard</button>
            <button onclick="switchTab('list')" id="tab-list" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-gray-400 hover:bg-gray-50 transition-all"><span class="material-symbols-outlined">list_alt</span> Resumen Clientes</button>
        </nav>
    </aside>

    <!-- Content -->
    <main class="flex-1 flex flex-col p-8 gap-6 overflow-y-auto">
        <header class="flex justify-between items-center shrink-0">
            <h2 id="title" class="text-3xl font-black tracking-tight">Dashboard Comercial</h2>
            <button onclick="fetchCRMData()" class="bg-black text-white px-6 py-2 rounded-full font-bold shadow-lg hover:scale-105 transition-transform">ACTUALIZAR DATOS</button>
        </header>

        <!-- KPI BUBBLES -->
        <div id="view-dash-kpis" class="grid grid-cols-3 gap-6 shrink-0">
            <div class="card text-center"><p class="text-xs font-bold text-gray-400 uppercase">Presupuesto Global</p><h3 id="kpi-total" class="text-3xl font-black mt-1">0 €</h3></div>
            <div class="card text-center"><p class="text-xs font-bold text-gray-400 uppercase">Área Líder</p><h3 id="kpi-area" class="text-2xl font-black mt-1">-</h3></div>
            <div class="card text-center"><p class="text-xs font-bold text-gray-400 uppercase">Promedio Éxito</p><h3 id="kpi-exito" class="text-3xl font-black text-blue-600 mt-1">0%</h3></div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="view-dash" class="grid grid-cols-2 gap-6 flex-1">
            <div class="card flex flex-col">
                <h4 class="text-sm font-bold text-gray-400 uppercase mb-4">Ranking de Áreas (Importe)</h4>
                <div class="chart-box"><canvas id="chart-bar-areas"></canvas></div>
            </div>
            <div class="card flex flex-col">
                <h4 class="text-sm font-bold text-gray-400 uppercase mb-4">Top 10 Clientes (Distribución)</h4>
                <div class="chart-box"><canvas id="chart-pie-clientes"></canvas></div>
            </div>
            <div class="card col-span-2 flex flex-col">
                <h4 class="text-sm font-bold text-gray-400 uppercase mb-4">% Éxito por Área Comercial</h4>
                <div class="chart-box"><canvas id="chart-bar-exito"></canvas></div>
            </div>
        </div>

        <!-- LIST VIEW (Oculta) -->
        <div id="view-list" class="hidden bg-white rounded-3xl border shadow-sm overflow-hidden flex-col h-full">
            <div class="overflow-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase">Cliente</th>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase">Área</th>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase text-right">Presupuesto</th>
                            <th class="p-4 text-xs font-bold text-gray-400 uppercase">Éxito Objetivo</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="loader" class="fixed inset-0 bg-white/80 backdrop-blur-md flex items-center justify-center z-50 hidden flex-col">
        <div class="w-12 h-12 border-4 border-gray-200 border-t-black rounded-full animate-spin"></div>
        <p class="mt-4 font-black text-sm tracking-widest">SINCRONIZANDO...</p>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxCXZbP6BpR_GcRlEaScTgUJdhqqmEegZIQNeFcFp4QXjP-tQfX6gT0rRqzo7H9_xto/exec';
        let charts = {};

        function switchTab(t) {
            document.getElementById('view-dash').classList.toggle('hidden', t === 'list');
            document.getElementById('view-dash-kpis').classList.toggle('hidden', t === 'list');
            document.getElementById('view-list').classList.toggle('hidden', t === 'dash');
            document.getElementById('tab-dash').className = t === 'dash' ? 'nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold' : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-gray-400 hover:bg-gray-50';
            document.getElementById('tab-list').className = t === 'list' ? 'nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold' : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-gray-400 hover:bg-gray-50';
            document.getElementById('title').innerText = t === 'dash' ? 'Dashboard Comercial' : 'Resumen por Clientes';
        }

        async function fetchCRMData() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const r = await fetch(API_URL);
                const data = await r.json();
                renderAll(data.filter(i => i.cliente));
            } catch (e) { alert("Error de conexión"); }
            document.getElementById('loader').classList.add('hidden');
        }

        function renderAll(data) {
            const groups = {};
            let globalPres = 0, globalExito = 0;

            data.forEach(i => {
                const a = i.area || 'Sin Área';
                if(!groups[a]) groups[a] = { pres: 0, exito: 0, n: 0 };
                groups[a].pres += i.presupuesto;
                groups[a].exito += i.cumplimiento;
                groups[a].n++;
                globalPres += i.presupuesto;
                globalExito += i.cumplimiento;
            });

            const areas = Object.entries(groups).map(([name, v]) => ({ name, pres: v.pres, exito: v.exito / v.n })).sort((a,b) => b.pres - a.pres);

            // KPIs
            document.getElementById('kpi-total').innerText = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(globalPres);
            document.getElementById('kpi-area').innerText = areas[0]?.name || '-';
            document.getElementById('kpi-exito').innerText = (globalExito / data.length).toFixed(1) + '%';

            // Chart Areas
            initChart('chart-bar-areas', 'bar', areas.map(a => a.name), areas.map(a => a.pres), 'Presupuesto €', '#000');
            initChart('chart-bar-exito', 'bar', areas.map(a => a.name), areas.map(a => a.exito), '% Éxito Promedio', '#2563eb');
            
            // Pie Top Clientes
            const top = [...data].sort((a,b) => b.presupuesto - a.presupuesto).slice(0, 10);
            initChart('chart-pie-clientes', 'doughnut', top.map(t => t.cliente), top.map(t => t.presupuesto), 'Importe', ['#000','#2563eb','#3b82f6','#60a5fa','#93c5fd','#bfdbfe','#e5e7eb','#d1d5db','#f3f4f6','#9ca3af']);

            // Table
            document.getElementById('table-body').innerHTML = data.map(i => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="p-4 text-sm font-bold text-gray-900">${i.cliente}</td>
                    <td class="p-4 text-xs text-gray-500">${i.area}</td>
                    <td class="p-4 text-sm font-bold text-right">${new Intl.NumberFormat('es-ES').format(i.presupuesto)} €</td>
                    <td class="p-4">
                        <div class="flex items-center gap-3">
                            <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-blue-600" style="width:${i.cumplimiento}%"></div></div>
                            <span class="text-xs font-black w-10 text-right">${i.cumplimiento.toFixed(0)}%</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function initChart(id, type, labels, d, label, colors) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type, data: { labels, datasets: [{ label, data: d, backgroundColor: colors, borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: type === 'doughnut', position: 'right', labels: { boxWidth: 10, font: { size: 10 } } } }, scales: type === 'bar' ? { y: { beginAtZero: true } } : {} }
            });
        }
        window.onload = fetchCRMData;
    </script>
</body>
</html>
