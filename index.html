<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INJUSA CRM - Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; } /* Evita scroll global */
        .kpi-card { background: white; border-radius: 1.5rem; padding: 1.5rem; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .chart-container { position: relative; height: 35vh; width: 100%; }
    </style>
</head>
<body class="bg-[#f0f2f5] h-screen flex flex-col p-6">

    <!-- HEADER & REFRESH -->
    <header class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-black text-white rounded-lg flex items-center justify-center font-bold">I</div>
            <h1 class="text-xl font-bold tracking-tight">COMERCIAL ANALYTICS INJUSA</h1>
        </div>
        <button onclick="fetchCRMData()" class="bg-black text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-gray-800 transition-all flex items-center gap-2">
            ACTUALIZAR DATOS
        </button>
    </header>

    <!-- KPI BUBBLES -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="kpi-card text-center">
            <p class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Presupuesto Global</p>
            <h2 id="kpi-total" class="text-3xl font-black text-black">0 €</h2>
        </div>
        <div class="kpi-card text-center border-l-4 border-l-blue-500">
            <p class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Área Líder</p>
            <h2 id="kpi-top-area" class="text-2xl font-black text-black">-</h2>
        </div>
        <div class="kpi-card text-center">
            <p class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Éxito Objetivo Total</p>
            <h2 id="kpi-avg" class="text-3xl font-black text-blue-600">0%</h2>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 flex-1 overflow-hidden">
        
        <!-- BAR CHART: AREAS (Sorted) -->
        <div class="bg-white p-6 rounded-[2rem] shadow-sm flex flex-col">
            <h4 class="text-sm font-black uppercase mb-4 text-gray-400">Ranking Áreas Comerciales (Importe)</h4>
            <div class="chart-container">
                <canvas id="chart-areas"></canvas>
            </div>
        </div>

        <!-- PIE CHART: TOP CLIENTS (The "Cheese") -->
        <div class="bg-white p-6 rounded-[2rem] shadow-sm flex flex-col">
            <h4 class="text-sm font-black uppercase mb-4 text-gray-400">Distribución Top 15 Clientes</h4>
            <div class="chart-container">
                <canvas id="chart-pie-clientes"></canvas>
            </div>
        </div>

    </div>

    <!-- MODAL CARGA -->
    <div id="loader" class="fixed inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-black"></div>
            <p class="mt-4 font-bold">SINCRONIZANDO CRM...</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxCXZbP6BpR_GcRlEaScTgUJdhqqmEegZIQNeFcFp4QXjP-tQfX6gT0rRqzo7H9_xto/exec';
        let charts = {};

        async function fetchCRMData() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const validData = data.filter(item => item.cliente && item.cliente.trim() !== "");
                
                renderDashboard(validData);
            } catch (e) {
                console.error(error);
                alert("Error al conectar con la hoja de cálculo.");
            }
            document.getElementById('loader').classList.add('hidden');
        }

        function renderDashboard(data) {
            // 1. CÁLCULO DE KPIs
            const totalEuros = data.reduce((a, b) => a + (b.presupuesto || 0), 0);
            const exitoMedio = data.reduce((a, b) => a + (b.cumplimiento || 0), 0) / data.length;

            document.getElementById('kpi-total').innerText = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(totalEuros);
            document.getElementById('kpi-avg').innerText = exitoMedio.toFixed(1) + '%';

            // 2. PROCESAR ÁREAS (ORDENADAS)
            const areasMap = {};
            data.forEach(item => {
                const area = item.area || 'Sin Área';
                areasMap[area] = (areasMap[area] || 0) + item.presupuesto;
            });

            // Ordenar áreas de mayor a menor importe
            const sortedAreas = Object.entries(areasMap)
                .sort((a, b) => b[1] - a[1]);
            
            document.getElementById('kpi-top-area').innerText = sortedAreas[0] ? sortedAreas[0][0] : '-';

            initChart('chart-areas', 'bar', {
                labels: sortedAreas.map(a => a[0]),
                datasets: [{
                    label: 'Importe Total €',
                    data: sortedAreas.map(a => a[1]),
                    backgroundColor: '#000',
                    borderRadius: 10
                }]
            });

            // 3. TOP 15 CLIENTES (EL QUESO)
            const sortedClients = [...data]
                .sort((a, b) => b.presupuesto - a.presupuesto)
                .slice(0, 15);

            initChart('chart-pie-clientes', 'doughnut', {
                labels: sortedClients.map(c => c.cliente),
                datasets: [{
                    data: sortedClients.map(c => c.presupuesto),
                    backgroundColor: ['#000', '#2563eb', '#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe', '#d1d5db', '#e5e7eb', '#f3f4f6', '#000', '#2563eb', '#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe'],
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            }, { 
                plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } } },
                cutout: '60%'
            });
        }

        function initChart(id, type, data, extraOptions = {}) {
            if (charts[id]) charts[id].destroy();
            const ctx = document.getElementById(id).getContext('2d');
            charts[id] = new Chart(ctx, {
                type: type,
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: type === 'doughnut' } },
                    scales: type === 'bar' ? { y: { beginAtZero: true }, x: { grid: { display: false } } } : {},
                    ...extraOptions
                }
            });
        }

        window.onload = fetchCRMData;
    </script>
</body>
</html>
