<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INJUSA CRM - Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .nav-active { background: #000; color: #fff; }
        .chart-box { height: 300px; position: relative; }
    </style>
</head>
<body class="bg-[#f3f4f6] flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r flex flex-col p-6 shrink-0">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-black text-white rounded-lg flex items-center justify-center font-black">I</div>
            <h1 class="font-black text-xl tracking-tighter">CRM INJUSA</h1>
        </div>
        <nav class="flex-1 space-y-2">
            <button onclick="switchTab('dash')" id="tab-dash" class="nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all"><span class="material-symbols-outlined">dashboard</span> Dashboard</button>
            <button onclick="switchTab('list')" id="tab-list" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-gray-400 hover:bg-gray-50 transition-all"><span class="material-symbols-outlined">table_chart</span> Resumen Clientes</button>
        </nav>
    </aside>

    <!-- Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="p-8 flex justify-between items-center bg-white border-b sticky top-0 z-10">
            <h2 id="title" class="text-2xl font-black">Dashboard Visual</h2>
            <button onclick="fetchCRMData()" class="bg-black text-white px-6 py-2 rounded-lg font-bold shadow-lg hover:bg-gray-800 transition-all">ACTUALIZAR</button>
        </header>

        <div class="p-8 space-y-8">
            <!-- KPIs -->
            <div id="kpi-row" class="grid grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border shadow-sm text-center">
                    <p class="text-xs font-bold text-gray-400 uppercase">Presupuesto Global</p>
                    <h3 id="kpi-total" class="text-3xl font-black mt-2">0 €</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl border-l-4 border-l-blue-600 shadow-sm text-center">
                    <p class="text-xs font-bold text-gray-400 uppercase">Área Top (Importe)</p>
                    <h3 id="kpi-top-area" class="text-2xl font-black mt-2">-</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl border shadow-sm text-center">
                    <p class="text-xs font-bold text-gray-400 uppercase">Éxito Medio Global</p>
                    <h3 id="kpi-avg" class="text-3xl font-black mt-2">0%</h3>
                </div>
            </div>

            <!-- DASHBOARD VIEW -->
            <div id="view-dash" class="grid grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-2xl border shadow-sm">
                    <h4 class="font-bold mb-4 text-gray-500 uppercase text-xs">Ranking Áreas por Importe (€)</h4>
                    <div class="chart-box"><canvas id="chart-areas"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-2xl border shadow-sm">
                    <h4 class="font-bold mb-4 text-gray-500 uppercase text-xs">Reparto Top 15 Clientes</h4>
                    <div class="chart-box"><canvas id="chart-pie"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-2xl border shadow-sm col-span-2">
                    <h4 class="font-bold mb-4 text-gray-500 uppercase text-xs">% Éxito por Área Comercial</h4>
                    <div class="chart-box"><canvas id="chart-exito"></canvas></div>
                </div>
            </div>

            <!-- CLIENT LIST VIEW -->
            <div id="view-list" class="hidden bg-white border rounded-2xl shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-4 text-xs font-bold uppercase text-gray-400">Cliente</th>
                            <th class="p-4 text-xs font-bold uppercase text-gray-400">Área</th>
                            <th class="p-4 text-xs font-bold uppercase text-gray-400 text-right">Presupuesto</th>
                            <th class="p-4 text-xs font-bold uppercase text-gray-400">Éxito Objetivo</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxCXZbP6BpR_GcRlEaScTgUJdhqqmEegZIQNeFcFp4QXjP-tQfX6gT0rRqzo7H9_xto/exec';
        let charts = {};

        function switchTab(t) {
            const isDash = t === 'dash';
            document.getElementById('view-dash').classList.toggle('hidden', !isDash);
            document.getElementById('kpi-row').classList.toggle('hidden', !isDash);
            document.getElementById('view-list').classList.toggle('hidden', isDash);
            document.getElementById('tab-dash').className = isDash ? 'nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold' : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-gray-400 hover:bg-gray-50';
            document.getElementById('tab-list').className = !isDash ? 'nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold' : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-gray-400 hover:bg-gray-50';
            document.getElementById('title').innerText = isDash ? 'Dashboard Visual' : 'Desglose por Clientes';
        }

        async function fetchCRMData() {
            try {
                const r = await fetch(API_URL);
                const data = await r.json();
                render(data);
            } catch (e) { console.error(e); }
        }

        function render(data) {
            const groups = {};
            let globalPres = 0, globalExito = 0;

            data.forEach(i => {
                const a = i.area || 'Sin Área';
                if(!groups[a]) groups[a] = { pres: 0, exito: 0, n: 0 };
                groups[a].pres += i.presupuesto;
                groups[a].exito += i.cumplimiento;
                groups[a].n++;
                globalPres += i.presupuesto;
                globalExito += i.cumplimiento;
            });

            const areas = Object.entries(groups).map(([name, v]) => ({ name, pres: v.pres, exito: v.exito / v.n })).sort((a,b) => b.pres - a.pres);

            // ACTUALIZACIÓN DE KPIs
            document.getElementById('kpi-total').innerText = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(globalPres);
            document.getElementById('kpi-top-area').innerText = areas[0]?.name || '-';
            document.getElementById('kpi-avg').innerText = (globalExito / data.length).toFixed(1) + '%';

            // GRÁFICAS
            initChart('chart-areas', 'bar', areas.map(a => a.name), areas.map(a => a.pres), 'Importe €', '#000');
            initChart('chart-exito', 'bar', areas.map(a => a.name), areas.map(a => a.exito), '% Éxito', '#2563eb');
            
            const top = [...data].sort((a,b) => b.presupuesto - a.presupuesto).slice(0, 15);
            initChart('chart-pie', 'doughnut', top.map(t => t.cliente), top.map(t => t.presupuesto), 'Importe', ['#000', '#2563eb', '#3b82f6', '#60a5fa', '#93c5fd']);

            // TABLA CLIENTES
            document.getElementById('table-body').innerHTML = data.map(i => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="p-4 text-sm font-bold">${i.cliente}</td>
                    <td class="p-4 text-xs text-gray-500">${i.area}</td>
                    <td class="p-4 text-sm font-bold text-right">${new Intl.NumberFormat('es-ES').format(i.presupuesto)} €</td>
                    <td class="p-4">
                        <div class="flex items-center gap-3">
                            <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-blue-600" style="width:${i.cumplimiento}%"></div></div>
                            <span class="text-xs font-black w-10 text-right">${i.cumplimiento.toFixed(0)}%</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function initChart(id, type, labels, d, label, colors) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type, data: { labels, datasets: [{ label, data: d, backgroundColor: colors, borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: type === 'doughnut' } } }
            });
        }
        window.onload = fetchCRMData;
    </script>
</body>
</html>
